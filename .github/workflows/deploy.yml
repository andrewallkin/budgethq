name: Build and push images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra backend --extra dev

      - name: Run pytest
        env:
          POSTGRES_DB: budget_db
          POSTGRES_USER: budget_user
          POSTGRES_PASSWORD: budget_user
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          RESTRICT_AUTHORIZED_USERS: "true"
          AUTHORIZED_USERS: test@example.com
          ENCRYPTION_KEY: test-encryption-key-not-real
        run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Derive image metadata
        id: image_meta
        run: |
          set -euo pipefail

          BRANCH_SLUG="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g' | cut -c1-40)"
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE_REPO="andrewallkin/budgethq"

          BACKEND_IMAGE="${IMAGE_REPO}:backend-${BRANCH_SLUG}-${SHORT_SHA}"
          FRONTEND_IMAGE="${IMAGE_REPO}:frontend-${BRANCH_SLUG}-${SHORT_SHA}"
          BACKEND_BRANCH_LATEST="${IMAGE_REPO}:backend-${BRANCH_SLUG}-latest"
          FRONTEND_BRANCH_LATEST="${IMAGE_REPO}:frontend-${BRANCH_SLUG}-latest"

          echo "backend_image=${BACKEND_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "frontend_image=${FRONTEND_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "backend_branch_latest=${BACKEND_BRANCH_LATEST}" >> "${GITHUB_OUTPUT}"
          echo "frontend_branch_latest=${FRONTEND_BRANCH_LATEST}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image_meta.outputs.backend_image }}
            ${{ steps.image_meta.outputs.backend_branch_latest }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.image_meta.outputs.frontend_image }}
            ${{ steps.image_meta.outputs.frontend_branch_latest }}
