
resource: budgethq://banking/error-handling
version: "1.1"
updated: "2026-11-22"

purpose: >
  Decision rules for errors, ambiguity, and recovery across Investec MCP workflows.

recovery_principle: >
  Recovery must be based on evidence of the prior action's state. Never use
  retrying create_investec_transfer or create_investec_payment as a way to
  discover whether the original call succeeded.

situations:
  tool_error_before_queue:
    behaviour: >
      Report the error. Do not assume a movement id exists or that a movement
      was created. Correct the inputs or configuration and proceed with a new
      attempt only when the user still intends to execute the action and the
      parameters are sufficiently established.

  tool_timeout_after_create:
    behaviour: >
      Treat the outcome as ambiguous until verified. If the movement id is
      known, call get_investec_movement using that id. If the movement id is
      unknown, use supported Investec read tools and available evidence to
      establish whether the original movement was created. Do not assume that
      a movement-search endpoint exists if it is not available. Do not blindly
      retry the create call. If an intentional retry of the same logical
      operation is justified and idempotency behaviour is supported, reuse the
      original idempotency_key. Never generate a new idempotency key merely
      to bypass uncertainty about the original call.

  movement_pending_telegram:
    behaviour: >
      The movement is awaiting human approval through the Telegram approval
      process. Monitor the movement using get_investec_movement when the
      execution environment supports continued monitoring. Do not create a
      second movement while the original remains pending. The Telegram
      approval window is 15 minutes. If monitoring cannot continue, report
      the observed status and disclose the monitoring limitation.

  movement_approved_not_sent_yet:
    behaviour: >
      If the Telegram approval has occurred but the movement has not yet
      reached a sent state, monitor using get_investec_movement when the
      execution environment supports continued monitoring. Do not queue a
      duplicate movement merely because processing is delayed. If further
      bank-side authorisation is required, report that requirement clearly.

  movement_expired:
    behaviour: >
      Report that the 15-minute Telegram approval window expired and that the
      original movement was not approved within that window. Do not
      automatically resubmit. If the user still wants to proceed, a new
      movement requires a fresh user request or alignment on the intended
      action and parameters, followed by a new create_* request and Telegram
      approval. Use a new idempotency key for a genuinely new logical
      movement rather than reusing the key associated with the expired
      movement.

  movement_rejected:
    behaviour: >
      Report that the movement was rejected. Stop. Do not automatically
      resubmit or alter the movement. A new movement requires a fresh user
      request and confirmation of its parameters.

  movement_needs_authorisation:
    behaviour: >
      Report that Investec accepted the movement but requires further
      bank-side authorisation. Monitor the movement status using
      get_investec_movement where continued monitoring is supported.
      Do not attempt to bypass Investec's authorisation requirements or
      create a duplicate movement. If the owner must take further action,
      state that explicitly.

  movement_failed:
    behaviour: >
      Report the failure and inspect the movement using Investec tools.
      Inspect investec_response or other returned error details where
      available. Investigate the likely cause using available evidence
      before considering a new attempt. Do not automatically retry a
      financial movement, even when the failure appears transient.
      A new attempt requires the user's intent to proceed and confirmed
      parameters.

  idempotent_200_replay:
    behaviour: >
      If the same idempotency_key returns an existing movement, treat the
      result as reconciliation of the original logical operation, not as
      creation of a new movement. Verify the returned or existing movement's
      status using Investec tools. Report the original movement and its
      observed status accurately. Do not describe it as a new queue unless
      a genuinely new movement was created.

  duplicate_suspected:
    behaviour: >
      Stop before creating another movement. Compare existing movements
      using Investec evidence where available, including amount, source
      account, destination account or beneficiary, references, movement
      type, status, and creation time. Similarity alone does not prove a
      duplicate. If ambiguity remains, ask the user before proceeding.
      Do not automatically cancel, reverse, or modify an existing
      movement to resolve suspected duplication.

  insufficient_balance:
    behaviour: >
      Stop. Do not silently change the amount, source account, or intended
      transaction. Report the balance evidence and offer alternatives
      such as reducing the amount or funding the source account first.
      Any revised movement must reflect the user's intended parameters.

  beneficiary_not_matched:
    behaviour: >
      Stop. Clarify the intended beneficiary and verify the beneficiary_id
      using Investec beneficiary read/list tools. Never guess or select
      a beneficiary based only on a similar name or account number.

  source_account_not_found:
    behaviour: >
      Stop. Re-list or read the Investec accounts to establish the correct
      account_id. Never guess or substitute an account id.

  transfer_dest_not_own_account:
    behaviour: >
      If the backend rejects an external destination as invalid for a
      transfer, use the payment workflow for an external beneficiary
      where appropriate. Verify the beneficiary and payment parameters
      before creating the payment. Do not silently convert the operation
      without establishing that the payment is the user's intended action.

  telegram_not_connected:
    behaviour: >
      Report the configuration blocker. The user must connect or correct
      Telegram configuration in BudgetHQ settings before movements
      requiring Telegram approval can proceed.

  investec_credentials_missing:
    behaviour: >
      Report the configuration blocker. Do not attempt write operations
      until the required Investec credentials are configured.

  verification_endpoint_failure:
    behaviour: >
      State that verification is incomplete. Name the Investec tool that
      failed and surface its error details where available. Verification
      must use Investec tools. Do not substitute BudgetHQ transaction
      feeds, transaction records, UI synchronisation, or bookkeeping
      data as verification evidence. Do not claim success or failure
      without sufficient Investec evidence.

  partial_orchestration:
    behaviour: >
      For any multi-step financial workflow, report each stage separately,
      including the operation type, amount, source, destination or
      beneficiary, movement_id, references, and observed Investec status
      where available. Clearly state which stages succeeded, failed,
      remain pending, require authorisation, or could not be verified.
      Do not treat the overall workflow as successful unless all
      required stages have reached their intended verified outcomes.
      A successful transfer does not imply that a subsequent payment
      succeeded, and a successful payment does not imply that a
      preceding funding transfer succeeded.

retry_rules:
  allowed_when:
    - >
      The original operation is reconciled and verified, and a genuinely
      new attempt is explicitly requested by the user with confirmed
      parameters.
    - >
      An intentional idempotent replay is used to reconcile or recover
      the same logical operation, using the original idempotency key
      where supported, without creating a distinct financial movement.
    - >
      The prior movement's outcome is established and the user explicitly
      requests a new attempt after reviewing the outcome.

  forbidden_when:
    - >
      The original movement's status is unknown or ambiguous and there
      is insufficient evidence to establish its outcome.
    - >
      A movement is pending Telegram approval, awaiting processing,
      or awaiting bank-side authorisation.
    - >
      A new idempotency key is used to bypass duplicate protection or
      uncertainty about an original operation without the user's
      awareness and a justified new logical action.
    - >
      A movement is rejected, expired, or failed and a new movement
      would be created automatically without fresh user intent.
    - >
      BudgetHQ transaction synchronisation or UI visibility is used
      to infer that an original movement failed and justify a retry.

error_payload_shape:
  mcp_invoke_external:
    description: >
      Tools may return an error payload such as
      {"error": {"code": "...", "message": "..."}}. Actual error
      structures may vary.
    agent_behaviour: >
      Surface the returned error code and message where available.
      Identify the relevant situation in this resource and follow
      the corresponding recovery rules. Do not assume every tool
      error has the same structure or that an error necessarily
      means the financial movement was not created.
