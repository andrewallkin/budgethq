resource: budgethq://banking/payments
version: "1.2"
updated: "2026-11-22"
workflow_id: payment_to_beneficiary

purpose: >
  Pay an existing Investec beneficiary from a source account.
  Does not create, edit or delete beneficiaries.

required_inputs:
  - source_account
  - beneficiary_id
  - amount
  - my_reference
  - their_reference

reference_rules:
  - All payment references must be in FULL CAPITALS.
  - Payment references do not require a TRANSFER suffix.
  - References must be meaningful for the movement.
  - Validate references before presenting the movement for alignment.
  - Do not silently alter references after alignment.

preconditions:
  mandatory:
    - Source account is identified.
    - Beneficiary ID matches a trusted Investec beneficiary record.
    - Beneficiary identity is unambiguous.
    - Amount and both references are explicit and user-aligned.
    - User understands Telegram approval is required.
    - Telegram is connected.
  conditional:
    - Balance check when funding sufficiency is relevant.
    - Duplicate payment scan when a potentially matching movement exists.
    - Profile-scoped beneficiary lookup when global beneficiary records are ambiguous.

tools:
  - list_investec_accounts
  - list_investec_beneficiaries
  - list_investec_profile_beneficiaries
  - list_investec_profiles
  - get_investec_account_balance
  - create_investec_payment
  - get_investec_movement
  - list_investec_transactions
  - list_investec_pending_transactions

execution_sequence:

  "1_identify_source":
    mandatory: true
    tool: list_investec_accounts
    action: >
      Confirm source account exists and resolve the correct account ID.

  "2_identify_beneficiary":
    mandatory: true
    tools:
      - list_investec_beneficiaries
      - list_investec_profile_beneficiaries
    action: >
      Match beneficiary ID to the beneficiary's identity and returned
      bank details. If multiple candidates exist, stop and ask the user.
      Do not pay without a unique match.

  "3_validate_references":
    mandatory: true
    action: >
      Validate that both payment references are uppercase.
      Do not add a TRANSFER suffix unless it is part of the
      intended payment reference.

  "4_check_balance":
    mandatory: false
    tool: get_investec_account_balance
    action: >
      Assess available funds when relevant. Warn if likely
      insufficient. Do not silently change the amount.

  "5_check_duplicates":
    mandatory: false
    tools:
      - list_investec_transactions
      - list_investec_pending_transactions
    action: >
      Search for potentially matching payments using beneficiary,
      amount, source, references, timing, movement type and status.

    decision_rules:
      - A matching in-flight movement is a reason to pause and reconcile.
      - Similarity alone is not proof of duplication.
      - Do not automatically cancel, reverse or suppress a legitimate payment.
      - Investigate ambiguous duplicate status before proceeding.
      - Never blindly retry an ambiguous create result.

  "6_present_for_alignment":
    mandatory: true
    action: >
      Present beneficiary identity, returned bank details, amount,
      source account and references. Explain the Telegram approval
      requirement. Chat confirmation alone is not sufficient.

  "7_execute":
    mandatory: true
    tool: create_investec_payment
    parameters:
      account_id: source_account
      beneficiary_id: beneficiary_id
      amount: amount
      my_reference: my_reference
      their_reference: their_reference
      idempotency_key: >
        Use only when retrying the same logical payment after
        reconciliation of an ambiguous result.
    action: >
      Queue the payment and capture the returned movement ID.
    after:
      - Direct the user to Telegram Approve or Reject when pending.
      - Initiate verification using get_investec_movement.
      - Follow the verification resource.

  "8_verify":
    mandatory: true
    tool: get_investec_movement
    action: >
      Verify the movement status using the verification resource.
      Monitor where continued execution is available. Stop at a
      terminal state, expiry or monitoring limitation.

  "9_report":
    mandatory: true
    action: >
      Report movement ID, status, beneficiary, amount, source and
      references. Distinguish sent from pending, rejected, expired,
      failed and needs_authorisation.

scope_limits:
  - Beneficiary creation, editing and deletion are out of scope.
  - Payments must use existing beneficiary records.
  - Stop if beneficiary identity is ambiguous.

failure_handling:
  resource: budgethq://banking/error-handling