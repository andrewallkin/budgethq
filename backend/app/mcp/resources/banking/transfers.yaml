resource: budgethq://banking/transfers
version: "1.1"
updated: "2026-11-22"
workflow_id: transfer_between_accounts

purpose: >
  Transfer funds between the user's own Investec accounts. Destinations must be
  another owned account (beneficiaryAccountId), not an external bank account.

required_inputs:
  - source_account  # investec accountId
  - destination_account  # investec accountId, own account
  - amount  # string decimal
  - my_reference
  - their_reference

reference_rules:
  - All transfer references must be in FULL CAPITALS.
  - All transfer references must end with TRANSFER.
  - Both my_reference and their_reference must conform.
  - References must be meaningful for the movement.
  - Validate references before presenting the movement for alignment.
  - Do not silently alter references after alignment.

preconditions:
  mandatory:
    - Source and destination identifiers are unambiguous Investec accountIds.
    - Destination is a different own account validated via list_investec_accounts.
    - Amount is explicitly agreed with the user.
    - Both references are established and comply with reference_rules.
    - User understands Telegram will be asked to approve.
    - Telegram is connected for the owner.
  conditional:
    - Duplicate check when a potentially matching pending or recent movement exists.
    - Balance check via get_investec_account_balance on source when funding is non-obvious.
    - Skip account re-listing when ids were just read from list_investec_accounts in-session.

tools:
  - list_investec_accounts
  - get_investec_account_balance
  - create_investec_transfer
  - get_investec_movement
  - list_investec_transactions
  - list_investec_pending_transactions

execution_sequence:
  "1_identify_accounts":
    mandatory: true
    tool: list_investec_accounts
    action: >
      Resolve source_account and destination_account to accountId, names, and products.
      Confirm destination is in the user's account list and is different from source.

  "2_validate_references":
    mandatory: true
    action: >
      Validate my_reference and their_reference. Both must be uppercase and end
      with TRANSFER. Correct nonconforming references before presenting the
      movement for alignment.

  "3_check_source_balance":
    mandatory: false
    tool: get_investec_account_balance
    action: >
      Check current/available balance on source when relevant. Warn if likely
      insufficient; do not silently change the amount.

  "4_check_duplicates":
    mandatory: false
    tools:
      - list_investec_transactions
      - list_investec_pending_transactions
    action: >
      Search for potentially matching transfers using amount, source, destination,
      references, timing, movement type, and status where available.

    decision_rules:
      - >
        A matching in-flight movement for the same logical transfer is a reason
        to pause and reconcile before creating another.
      - >
        Similarity alone is not proof of duplication.
      - >
        Do not automatically cancel, reverse, or suppress a legitimate transfer
        solely because another similar movement exists.
      - >
        If duplicate status is ambiguous, investigate using Investec movement
        evidence and error-handling rules before proceeding.
      - >
        Do not blindly retry an ambiguous create result.

  "5_present_for_alignment":
    mandatory: true
    action: >
      Present full transfer details to the user in chat: from, to, amount,
      my_reference and their_reference. Explain that execution requires Telegram
      approval after the tool queues the movement. Chat confirmation alone
      is not sufficient.

  "6_execute":
    mandatory: true
    tool: create_investec_transfer
    parameters:
      account_id: source_account
      beneficiary_account_id: destination_account
      amount: amount string
      my_reference: my_reference
      their_reference: their_reference
      idempotency_key: use when retrying the same logical transfer after ambiguity
    action: >
      Queue the transfer. Capture returned id as movement_id.
    after:
      - If status pending, direct user to Telegram Approve/Reject.
      - Initiate verification using get_investec_movement.
      - Follow the verification resource.

  "7_verify":
    mandatory: true
    tool: get_investec_movement
    action: >
      Verify the movement status and follow the verification resource.
      Monitor where the execution environment supports continued monitoring.
      Stop at a terminal state, expiry, or monitoring limitation.

  "8_report":
    mandatory: true
    action: >
      Report movement_id, observed status, amount, source, destination,
      and references. State money was not sent when the evidence supports
      pending, rejected, expired, or failed. Distinguish needs_authorisation
      from sent.

failure_handling:
  resource: budgethq://banking/error-handling

output_template:
  fields:
    - movement_id
    - kind
    - status
    - amount
    - source_account
    - destination_account
    - my_reference
    - their_reference
    - user_action_required  # e.g. Telegram approval pending