resource: budgethq://workflow-registry
version: "1.2"
updated: "2026-11-22"
applies_to: investec_banking_mcp

purpose: >
  Registry of supported Investec banking workflows exposed through BudgetHQ MCP.
  Before any money movement, status verification or multi-step banking
  orchestration, read this resource first and load every required resource
  for the chosen workflow.

when_to_consult:
  - Before calling create_investec_transfer or create_investec_payment
  - Before interpreting whether a transfer or payment completed
  - Before chaining transfers and payments
  - When the user asks to pay, transfer or fund an account
  - When the user asks to verify a banking action
  - When the user asks to establish a new monthly financial period
  - When executing the month-end funding transfer
  - After any ambiguous, timed-out or duplicate-looking banking result

global_resources:
  - budgethq://banking/core-rules
  - budgethq://banking/accounts-and-identifiers
  - budgethq://banking/verification
  - budgethq://banking/error-handling

workflows:

  transfer_between_accounts:
    description: >
      Move funds between the user's own Investec accounts.
    resource: budgethq://banking/transfers
    required_resources:
      - budgethq://banking/core-rules
      - budgethq://banking/accounts-and-identifiers
      - budgethq://banking/verification
      - budgethq://banking/error-handling

  payment_to_beneficiary:
    description: >
      Pay an existing Investec beneficiary. This workflow does not
      create, edit or delete beneficiaries.
    resource: budgethq://banking/payments
    required_resources:
      - budgethq://banking/core-rules
      - budgethq://banking/accounts-and-identifiers
      - budgethq://banking/verification
      - budgethq://banking/error-handling

  recurring_cost_execution:
    description: >
      Fund a designated account using a transfer, then initiate the
      second movement to the intended recipient or account. Each
      movement requires separate Telegram approval and verification.
    resource: budgethq://banking/recurring-costs
    required_resources:
      - budgethq://banking/core-rules
      - budgethq://banking/transfers
      - budgethq://banking/payments
      - budgethq://banking/verification
      - budgethq://banking/error-handling

  verify_banking_action:
    description: >
      Determine the actual status of a BudgetHQ Investec movement
      or investigate an ambiguous outcome. Verification is required
      before any retry.
    resource: budgethq://banking/verification
    required_resources:
      - budgethq://banking/core-rules
      - budgethq://banking/accounts-and-identifiers
      - budgethq://banking/error-handling

  monthly_period_setup:
    description: >
      Establish a new Monthly Money period, allocate salary,
      consolidate funds, execute agreed transfers, track recurring
      costs and arrange month-end funding for the following month's
      scheduled payments.
    resource: budgethq://banking/monthly-period-setup
    required_resources:
      - budgethq://banking/core-rules
      - budgethq://banking/accounts-and-identifiers
      - budgethq://banking/transfers
      - budgethq://banking/payments
      - budgethq://banking/recurring-costs
      - budgethq://banking/verification
      - budgethq://banking/error-handling
      - budgethq://banking/month-end-funding-transfer

  month_end_funding_transfer:
    description: >
      Reconcile the following month's debit orders and scheduled
      payments against the Monthly Money page and transfer the
      reconciled amount from Normal Savings to Daily.
    resource: budgethq://banking/month-end-funding-transfer
    required_resources:
      - budgethq://banking/core-rules
      - budgethq://banking/accounts-and-identifiers
      - budgethq://banking/transfers
      - budgethq://banking/verification
      - budgethq://banking/error-handling

mcp_tools_index:
  read_only:
    - list_investec_accounts
    - get_investec_account_balance
    - list_investec_transactions
    - list_investec_pending_transactions
    - list_investec_profiles
    - list_investec_profile_accounts
    - get_investec_authorisation_setup
    - list_investec_profile_beneficiaries
    - list_investec_beneficiaries
    - list_investec_beneficiary_categories
    - get_investec_movement
  write:
    - create_investec_transfer
    - create_investec_payment

non_authoritative_for_live_banking:
  tools:
    - list_transactions
    - get_transaction
  note: >
    BudgetHQ general transactions are for budgeting, categorisation
    and post-execution reconciliation. They may lag Investec and
    must not be used as the primary source to verify whether a
    just-submitted Investec movement completed.