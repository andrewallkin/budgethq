# Local development: hot reload, bind mounts, and bundled Postgres.
services:
  postgres:
    image: postgres:15
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-budget_user} -d ${POSTGRES_DB:-budget_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [postgres-net]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./backend/alembic/versions:/app/alembic/versions # Migration files appear locally
      - ./backend/app:/app/app # Hot reload for code changes
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload # Enable hot reload
    networks: [default, postgres-net]

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      HMR_CLIENT_PORT: ${FRONTEND_PORT:-3000}
    depends_on:
      - backend
    restart: unless-stopped
    networks: [default]

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  postgres-net:
    driver: bridge
